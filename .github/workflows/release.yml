name: Release

# Tag-driven, per architecture-standards P12: the tag is the release trigger, and the tag
# name is the version every artifact carries. Nothing here publishes from a branch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (no leading v). Packages are built but NOT published on a manual run."
        required: true

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build, test, pack
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version from the tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # The moving vN tag (see the final job) points at THIS commit, so action.yml's
      # default tools version must already be the version being released — otherwise a
      # consumer on @vN installs a version that does not exist. Caught here rather than
      # in someone else's workflow.
      - name: Verify action.yml agrees with this release
        env:
          WANT: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          want = os.environ["WANT"]
          text = open("action.yml").read()
          m = re.search(r'^  version:\n(?:.*\n)*?    default: "([^"]+)"', text, re.M)
          if not m:
              sys.exit("::error title=Release::could not read the version input default from action.yml")
          got = m.group(1)
          if got != want:
              sys.exit(f"::error title=Release::action.yml installs tools version '{got}' but this release is "
                       f"'{want}'. Bump action.yml and Directory.Build.props in a commit BEFORE tagging.")
          print(f"action.yml default matches the release: {got}")
          PY

      - name: Build
        run: dotnet build portcullis.sln -c Release -p:Version=${{ steps.version.outputs.version }}

      # A release that ships an untested engine is exactly the failure mode this project
      # documents itself against; the suite runs before anything is packed.
      - name: Test
        run: dotnet test portcullis.sln -c Release --no-build

      - name: Pack
        run: |
          dotnet pack src/Portcullis.Rules/Portcullis.Rules.csproj -c Release --no-build \
            -o artifacts -p:Version=${{ steps.version.outputs.version }}
          dotnet pack src/Portcullis.Cli/Portcullis.Cli.csproj -c Release --no-build \
            -o artifacts -p:Version=${{ steps.version.outputs.version }}
          dotnet pack src/Portcullis.CiComment/Portcullis.CiComment.csproj -c Release --no-build \
            -o artifacts -p:Version=${{ steps.version.outputs.version }}

      # Proves the analyzer package actually loads and fires from a plain PackageReference
      # before it is ever published — an analyzer whose DLL lands in the wrong folder
      # packs cleanly, installs cleanly, and silently does nothing at all.
      - name: Verify the analyzer package fires in a consumer project
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/consumer"; mkdir -p "$work/Domain"; cd "$work"
          cat > nuget.config <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="../../artifacts" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF
          sed -i "s|../../artifacts|$GITHUB_WORKSPACE/artifacts|" nuget.config
          cat > Consumer.csproj <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Portcullis.Analyzers" Version="${{ steps.version.outputs.version }}" PrivateAssets="all" />
            </ItemGroup>
          </Project>
          EOF
          cat > Stubs.cs <<'EOF'
          namespace Consumer;
          public class DbContext { protected DbSet<T> Set<T>() => new DbSet<T>(); }
          public class DbSet<T> { }
          public class WidgetDbContext : DbContext { public DbSet<Widget> Widgets => Set<Widget>(); }
          EOF
          cat > Domain/Widget.cs <<'EOF'
          namespace Consumer;
          public class Widget { public int Id { get; set; } }
          EOF
          if dotnet build 2>&1 | tee build.log | grep -q "PORTCULLIS_P9_ORPHAN_ENTITY"; then
            echo "analyzer package fires correctly from a PackageReference"
          else
            echo "::error title=Release::Portcullis.Analyzers produced no diagnostics in a consumer project — the package is inert."
            cat build.log
            exit 1
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: packages
          path: artifacts/*

  publish-nuget:
    name: Publish to NuGet
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: packages
          path: artifacts

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Push
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo "::error title=Release::NUGET_API_KEY secret is not set; nothing was published."
            exit 1
          fi
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  publish-container:
    name: Publish container to GHCR
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ needs.build.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.build.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # architecture-standards' OPEN-SOURCE-RELEASE guide, section 5: a GHCR package is
      # created PRIVATE on its first push regardless of the repository's own visibility,
      # and nothing flips it automatically. "Works for me, fails for everyone else" is
      # what that looks like from outside, so say it here rather than let it be
      # rediscovered.
      - name: Remind about GHCR package visibility
        run: |
          echo "::notice title=GHCR visibility::First publish? ghcr.io/${{ github.repository }} is PRIVATE until you flip it in the package's own settings (Packages -> letsgolegacy.portcullis -> Package settings -> Change visibility). Repo visibility does not do this for you."

  release-notes:
    name: GitHub release
    needs: [build, publish-nuget, publish-container]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: packages
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  moving-tag:
    name: Move the major tag
    needs: [build, publish-nuget, publish-container]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # GitHub Actions consumers reference a major tag (@v0) rather than an exact
      # version, so that tag has to be force-moved to each release. Done only after
      # NuGet and GHCR both succeeded — moving it earlier would point consumers at a
      # release whose packages do not exist.
      - name: Point vN at this release
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          major="v${VERSION%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
          echo "::notice title=Release::$major now points at $GITHUB_SHA - uses: ${{ github.repository }}@$major resolves here."
